  <rect width="180" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="14" width="140" height="44" rx="4" fill="#0ea5e9" opacity=".12" stroke="#0284c7"/>
  <text x="90" y="41" text-anchor="middle" font-size="18">🌾</text>
  <text x="90" y="76" text-anchor="middle" font-size="10.5" fill="#475569">tu computadora</text>
