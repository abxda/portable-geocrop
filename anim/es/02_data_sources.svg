<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="Segoe UI,system-ui,sans-serif">
<rect width="760" height="352" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">¿De dónde salen las imágenes? Catálogos abiertos (y GEE opcional)</text>
