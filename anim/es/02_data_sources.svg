<g transform="translate(410,236)">
  <rect width="220" height="52" rx="8" fill="#fefce8" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="92" y="21" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Google Earth Engine</text>
  <text x="92" y="38" text-anchor="middle" font-size="8.2" fill="#d97706">OPCIONAL: solo si tienes cuenta</text>
  <g transform="translate(180,16)">
