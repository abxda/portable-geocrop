<line x1="520" y1="236" x2="520" y2="208" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="20" y="314" font-size="12.5" fill="#475569">Por defecto: catálogos STAC anónimos transmiten solo los píxeles de tu zona (lecturas por rango sobre COGs) —</text><text x="20" y="329" font-size="12.5" fill="#475569">sin cuenta. GEE es un interruptor opcional, nunca un requisito.</text>
